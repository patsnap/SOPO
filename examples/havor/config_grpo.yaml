experiment_name: havor
trial_name: grpo_4b
user_root: /root
areal_path: ${user_root}/projects/rl/AReaL_20251111_040
model_path: ${user_root}/models/qwen3_4b_2507_ragtruth_sft_5k
data_path: ${user_root}/data/rl/ragtruth/train_rl_10k_20251124_reasoning_areal.jsonl
cluster:
  fileroot: ${areal_path}/experiments
  n_nodes: 2
  n_gpus_per_node: 8
  name_resolve:
    type: nfs
    nfs_record_root: ${areal_path}/name_resolve
seed: 42
total_train_epochs: 6
total_train_steps: null
tokenizer_path: ${actor.path}
allocation_mode: sglang:d8p1t1+megatron:d2p1t4
async_training: true

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 128
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: true

gconfig:
  # `n_sample` is not the actual group_size.
  # Actual group_size is determined by `n_trajs` due to agent implementation
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 8192 ### max_tokens_per_turn
  greedy: false
  temperature: 1.0
  top_p: 0.99

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${model_path}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: false
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32800
  pad_to_maximum: true
  optimizer:
    type: adam
    lr: 1e-6
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.01
  group_size: ${n_trajs}
  adv_norm:
    mean_level: group
    std_level: group
    group_size: ${n_trajs}
  # reward_cosine_sparse_config:
  #   enabled: true
  #   reshape_level: group  # or "group" for group-level reshape
  #   upper_bound_only: true
  #   group_size: ${n_trajs}  # only used when reshape_level is "group"
  # reward_norm:
  #   mean_level: group
  #   std_level: group
  #   group_size: ${n_trajs}
  # positive_adv_weight: 0.5
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behav_imp_weight_cap: 5.0
  dynamic_sampling: true
  megatron:
    use_deterministic_algorithms: true
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    distribute_saved_activations: null
    recompute_modules: null
  importance_sampling_level: sequence
  # seq_is_ratio_max: 1.1
  # seq_is_ratio_min: 0.97
  # enable_turns_advantage_scaling: true
  # turns_advantage_penalty: 0.2
  # turns_advantage_min_turns: 1
ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32800
  optimizer: null

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  log_level: warning
  max_running_requests: 16
  context_length: 32800
  mem_fraction_static: 0.9
  attention_backend: fa3
  max_prefill_tokens: 32768
  # 启用 prefix caching (radix cache) 以加速 rollout
  # 注意：如果启用，需要确保在权重更新时正确重置缓存
  disable_radix_cache: false

# datasets
train_dataset:
  batch_size: 64
  shuffle: true
  pin_memory: true
  type: rl
  path: ${data_path}

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 40
  freq_secs: 7200


recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 40
  freq_secs: 7200

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: ${areal_path}/tensorboard/havor/${trial_name}

# Launcher
launcher:
  inference_server_cpus_per_gpu: 3
  inference_server_mem_per_gpu: 51200
  trainer_cpus_per_gpu: 3
  trainer_mem_per_gpu: 51200
  # slurm:
  #   mount: /storage:/storage
  #   trainer_image:  /storage/images/areal-25.08-v0.3.3-v3.sif
  #   inference_server_image:  /storage/images/areal-25.08-v0.3.3-v3.sif

  trainer_env_vars: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

# judge_engine:
#   experiment_name: llm-judge
#   trial_name: trial0
#   max_concurrent_rollouts: 32
#   queue_size: null
#   consumer_batch_size: ${train_dataset.batch_size}
#   max_head_offpolicyness: 10000000
#   enable_rollout_tracing: false

n_trajs: 8
max_llm_calls_per_run: 1
max_tokens_per_trajectory: 32768
log_agent_stats: false
